    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
  }catch(e){err.textContent=(e&&e.message==='nocrypto')?'Open this page over https (or in Chrome/Edge) to unlock.':'Incorrect password.';btn.disabled=false;btn.textContent='Unlock';}
});
